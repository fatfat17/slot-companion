name: Weekly Catalog Update

on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/update-current-catalogs.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Commit verified catalog changes
        run: |
          if git diff --quiet -- data/machine-catalog.json data/pachinko-catalog.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/machine-catalog.json data/pachinko-catalog.json
          git commit -m "data: weekly catalog update"
          git push origin HEAD:main
